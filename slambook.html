
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BBOD | Slam Book 💜</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff4fa;
  color: #49364d;
}
header {
  background: #ead8f7;
  padding: 22px 15px;
  text-align: center;
}
header h1 { margin: 0; color: #684477; }
nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 18px;
  padding: 14px;
  background: #f8eafa;
}
nav a {
  color: #684477;
  text-decoration: none;
  font-weight: bold;
}
main {
  max-width: 760px;
  margin: 30px auto;
  padding: 20px;
}
.intro { text-align: center; margin-bottom: 25px; }
.card {
  background: white;
  padding: 22px;
  margin: 18px 0;
  border-radius: 18px;
  box-shadow: 0 4px 14px #d9c5df55;
}
label {
  display: block;
  font-weight: bold;
  margin: 16px 0 7px;
}
input, textarea, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #dbc8e2;
  border-radius: 10px;
  font: inherit;
  background: #fffaff;
}
textarea { min-height: 85px; resize: vertical; }
button {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  border: 0;
  border-radius: 12px;
  background: #9b72b5;
  color: white;
  font-size: 16px;
  font-weight: bold;
}
.note { font-size: 13px; color: #806b85; }
footer { text-align: center; padding: 25px; }
</style>
</head>
<body>

<header>
  <h1>BBOD 💜</h1>
  <p>Twenty members. Infinite memories.</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="index.html#gang">Gang</a>
  <a href="slambook.html">Slam Book</a>
  <a href="index.html#memories">Memories</a>
  <a href="index.html#awards">Awards</a>
</nav>

<main>
  <div class="intro">
    <h2>📖 The BBOD Slam Book</h2>
    <p>Let's know each other a little better!</p>
    <p class="note">Fill in your answers and submit your page.</p>
  </div>

  <form id="slamForm">
    <div class="card">
      <h3>🌸 About You</h3>

      <label for="member">Your member number</label>
      <select id="member" required>
        <option value="">Choose your number</option>
      </select>

      <label for="name">Your name or nickname</label>
      <input id="name" required placeholder="What should we call you?">

      <label for="birthday">Birthday</label>
      <input id="birthday" type="date">

      <label for="personality">Describe yourself in three words</label>
      <input id="personality" placeholder="Funny, caring, dramatic...">

      <label for="hobby">Your favourite hobby</label>
      <input id="hobby">
    </div>

    <div class="card">
      <h3>🍕 Your Favourites</h3>

      <label for="food">Favourite food</label>
      <input id="food">

      <label for="song">Favourite song</label>
      <input id="song">

      <label for="movie">Favourite movie or series</label>
      <input id="movie">

      <label for="place">Dream travel destination</label>
      <input id="place">
    </div>

    <div class="card">
      <h3>😂 The Fun Part</h3>

      <label for="memory">Funniest BBOD memory</label>
      <textarea id="memory"></textarea>

      <label for="secret">A funny fact nobody knows about you</label>
      <textarea id="secret"></textarea>

      <label for="nickname">Your nickname in the gang</label>
      <input id="nickname">

      <label for="message">A message to all BBOD members</label>
      <textarea id="message"></textarea>
    </div>

    <button type="submit">💜 Submit My Answers</button>
    <p class="note" id="status"></p>
  </form>
</main>

<footer>Made with 💜 by BBOD</footer>

<script>
const memberSelect = document.getElementById("member");

for (let i = 1; i <= 20; i++) {
  const option = document.createElement("option");
  option.value = "Member " + i;
  option.textContent = "Member " + i;
  memberSelect.appendChild(option);
}

document.getElementById("slamForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const answers = {};
  this.querySelectorAll("input, textarea, select").forEach(field => {
    answers[field.id] = field.value;
  });

  const allAnswers = JSON.parse(localStorage.getItem("bbodSlamBook") || "[]");
  allAnswers.push(answers);
  localStorage.setItem("bbodSlamBook", JSON.stringify(allAnswers));

  document.getElementById("status").textContent =
    "Your answers are saved on this device! 💜";

  this.reset();
});
</script>

</body>
</html>
